<kd-layout>
  <span title>Collations</span>

  <main pageContent>
    <ng-template ngFor let-item [ngForOf]="data">
      <mat-card class="card">
        <mat-card-header>
          <div mat-card-avatar>{{ item.siglum }}</div>
          <mat-card-title>{{ item.display }}</mat-card-title>
          <mat-card-subtitle>Chapter</mat-card-subtitle>
        </mat-card-header>
        <img
          mat-card-image
          height="auto"
          width="100%"
          [src]="imageEndPoint + item.image"
          class="card-image"
          alt="Photo of Chapter"
        />
        <mat-card-content> </mat-card-content>
        <mat-card-actions>
          <a [routerLink]="[item.siglum]" color="primary" mat-flat-button
            >View</a
          >
        </mat-card-actions>
      </mat-card>
    </ng-template>
  </main>
</kd-layout>

<svg
  id="svgfilters"
  aria-hidden="true"
  style="position: absolute; width: 0; height: 0; overflow: hidden"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>
  <defs>
    <filter
      id="dark-blue-sepia"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
      filterUnits="objectBoundingBox"
      primitiveUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feColorMatrix
        type="matrix"
        values=".33 .33 .33 0 0
          .33 .33 .33 0 0
          .33 .33 .33 0 0
          0 0 0 1 0"
        in="SourceGraphic"
        result="colormatrix"
      />
      <feComponentTransfer in="colormatrix" result="componentTransfer">
        <feFuncR type="table" tableValues="0.15 0.01 0.60" />
        <feFuncG type="table" tableValues="0.02 0.05 0.50" />
        <feFuncB type="table" tableValues="0.20 0.20 0.60" />
        <feFuncA type="table" tableValues="0 1" />
      </feComponentTransfer>
      <feBlend
        mode="normal"
        in="componentTransfer"
        in2="SourceGraphic"
        result="blend"
      />
    </filter>
  </defs>
</svg>
