@if (data) { @if(!highlightedRanges()) {
<p>
  @for (lineTokens of data.tokens; track $index) {
  <span>
    {{ lineTokens.join(' ') }}
  </span>
  }
</p>
} @else {
<p>
  @for (range of getLines(); track $index) {
  <span
    [ngStyle]="{
      color: range.color ? 'black' : undefined,
      'background-color': range.color
    }"
  >
    {{ range.text }}
  </span>
  }
</p>
}

<div class="cell-tools">
  @if(showFacsimilePreview$ | async) {
  <mat-icon
    aria-hidden="false"
    [fontIcon]="facsimilePanelIcon()"
    (click)="toggleFacimileInPanle()"
  ></mat-icon>
  }
</div>

} @else {
<div class="absent">
  <span> [absent] </span>
</div>
}
