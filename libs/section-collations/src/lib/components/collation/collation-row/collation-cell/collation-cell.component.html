@if (data) { @if (siglum === 'IH') {
<kd-collation-cell-poetry-text
  [tokens]="data.tokens"
  [lines]="data.ranges ?? []"
  [orderInMs]="
    data.adjustedOrder + 1 !== unitIndex ? data.adjustedOrder + 1 : undefined
  "
></kd-collation-cell-poetry-text>
} @else {
<kd-collation-cell-text
  [tokens]="data.tokens"
  [lines]="data.ranges ?? []"
  [orderInMs]="
    data.adjustedOrder + 1 !== unitIndex ? data.adjustedOrder + 1 : undefined
  "
  [highlightLine]="cellHighlightedLine()"
></kd-collation-cell-text>
}
<div class="cell-tools">
  @if(showFacsimilePreview$ | async) {
  <mat-icon
    aria-hidden="false"
    [fontIcon]="facsimilePanelIcon()"
    (click)="toggleFacimileInPanle()"
    [class.toggle-facsimile-active]="facsimilePanelIcon() === 'visibility'"
  ></mat-icon>
  }
</div>

} @else {
<div class="absent">
  <span>[absent]</span>
</div>
}
