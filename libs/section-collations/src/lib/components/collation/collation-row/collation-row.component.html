<div
  [ngClass]="{
    'current-result': currentResult,
    'search-result': searchResult && !currentResult,
    divider: unit.isDivider,
    'row-header': true,
  }"
  [ngStyle]="{
    'width.px':
      sigla.length * ((cellWidth$ | async) ?? 75) +
      2 * sigla.length * cellPadding,
  }"
>
  <div class="row-header-content">
    <span>({{ unit.formattedOrder }}) &nbsp;</span>
    <span>{{ unit.title }}</span>

    <!-- Analysis Button with Menu -->
    <mat-icon
      class="analysis-icon"
      [class.analyzing]="analyzing"
      [class.analyzed]="isAnalyzed"
      [title]="getAnalysisTooltip()"
      [matMenuTriggerFor]="!isAnalyzed && !analyzing ? analysisMenu : null"
      #menuTriggerElement="matMenuTrigger"
      (click)="isAnalyzed ? onAnalysisIconClick() : null"
    >
      {{ getAnalysisIcon() }}
    </mat-icon>

    <!-- Analysis Options Menu -->
    <mat-menu #analysisMenu="matMenu" class="analysis-menu">
      <div class="analysis-menu-header" (click)="$event.stopPropagation()">
        <h3>Analysis Configuration</h3>
        <p>Select pipeline and threshold</p>
      </div>

      <!-- Pipeline Selection -->
      <div class="menu-section" (click)="$event.stopPropagation()">
        <h4>Pipeline Version</h4>
        <div class="option-group">
          <button
            mat-menu-item
            (click)="selectPipeline('v1')"
            [class.selected]="selectedPipeline === 'v1'"
            class="pipeline-option"
          >
            <mat-icon>{{selectedPipeline === 'v1' ? 'radio_button_checked' : 'radio_button_unchecked'}}</mat-icon>
            <div class="option-content">
              <span class="option-title">Conservative Analysis</span>
              <span class="option-subtitle">Strict matching, fewer groups</span>
            </div>
          </button>
          <button
            mat-menu-item
            (click)="selectPipeline('v2')"
            [class.selected]="selectedPipeline === 'v2'"
            class="pipeline-option"
          >
            <mat-icon>{{selectedPipeline === 'v2' ? 'radio_button_checked' : 'radio_button_unchecked'}}</mat-icon>
            <div class="option-content">
              <span class="option-title">Balanced Analysis</span>
              <span class="option-subtitle">Moderate matching, standard groups</span>
            </div>
          </button>
          <button
            mat-menu-item
            (click)="selectPipeline('v3')"
            [class.selected]="selectedPipeline === 'v3'"
            class="pipeline-option"
          >
            <mat-icon>{{selectedPipeline === 'v3' ? 'radio_button_checked' : 'radio_button_unchecked'}}</mat-icon>
            <div class="option-content">
              <span class="option-title">Comprehensive Analysis</span>
              <span class="option-subtitle">Detailed matching, more groups</span>
            </div>
          </button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <!-- Threshold Selection -->
      <div class="menu-section" (click)="$event.stopPropagation()">
        <h4>Similarity Threshold</h4>
        <div class="option-group threshold-grid">
          <button
            mat-menu-item
            *ngFor="let t of thresholds"
            (click)="selectThreshold(t)"
            [class.selected]="selectedThreshold === t"
            class="threshold-option"
          >
            <mat-icon>{{selectedThreshold === t ? 'radio_button_checked' : 'radio_button_unchecked'}}</mat-icon>
            <span>{{ getThresholdLabel(t) }}</span>
          </button>
        </div>
      </div>

      <mat-divider></mat-divider>

      <!-- Start Analysis Button -->
      <div class="menu-footer" (click)="$event.stopPropagation()">
        <button
          mat-raised-button
          color="primary"
          class="start-analysis-btn"
          (click)="startAnalysis()"
        >
          <mat-icon>play_arrow</mat-icon>
          Start Analysis
        </button>
      </div>
    </mat-menu>
  </div>
</div>

<div
  *ngIf="!unit.isDivider"
  class="row-content"
  [class.map-focused]="mapFocused && !currentResult"
>
  <ng-template [ngIf]="rowData !== undefined" [ngIfElse]="loading">
    <kd-collation-cell
      *ngFor="let siglum of sigla; index as mediumIndex"
      class="collation-cell font-noto-naskh"
      [class.rtl]="!isLatinSiglum(siglum)"
      [class.ltr]="isLatinSiglum(siglum)"
      [attr.dir]="isLatinSiglum(siglum) ? 'ltr' : 'rtl'"
      [ngStyle]="{
        'width.px': ((cellWidth$ | async) ?? 0) + 2 * cellPadding,
        'min-width.px': ((cellWidth$ | async) ?? 0) + 2 * cellPadding,
        padding: cellPadding + 'px',
        'box-sizing': 'border-box',
        'flex-shrink': 0,
      }"
      [data]="rowData[siglum]"
      [siglum]="siglum"
      [chapterSiglum]="chapterSiglum"
      [unitIndex]="unit.order"
      [unitArrayIndex]="unitArrayIndex"
      [mediumIndex]="mediumIndex"
      [orderDisplay]="unit.formattedOrder"
    >
    </kd-collation-cell>
  </ng-template>

  <ng-template #loading>
    <div
      class="loading-container"
      [ngStyle]="{
        'width.px':
          sigla.length * ((cellWidth$ | async) ?? 75) + 2 * sigla.length * cellPadding,
      }"
    >
      <mat-progress-bar color="accent" mode="indeterminate"></mat-progress-bar>
    </div>
  </ng-template>
</div>
