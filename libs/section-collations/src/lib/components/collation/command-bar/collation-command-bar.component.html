@if(showMobileSearchPanel()) {
<mat-toolbar class="search-panel">
  <form class="search-panel-form">
    <mat-form-field subscriptSizing="dynamic" color="accent">
      <mat-icon matIconPrefix>search</mat-icon>
      <input
        [formControl]="searchControl"
        autocomplete="off"
        type="text"
        matInput
        placeholder="Search..."
      />
    </mat-form-field>
  </form>
  @if(numberOfResults() > 0) {
  <div class="result-nav">
    <div class="arrow" (click)="previousResult()"><p><| &nbsp;</p></div>
    <div class="number-of-results">
      <p>{{ currentResult() + 1 }} / {{ numberOfResults() }}</p>
    </div>
    <div class="arrow" (click)="nextResult()"><p>&nbsp; |></p></div>
  </div>
  }
</mat-toolbar>
}

<mat-toolbar class="command-bar">
  <div class="view-settings">
    <mat-slide-toggle
      [checked]="showMap$ | async"
      (change)="toggleMap($event.checked)"
      >Map</mat-slide-toggle
    >
    <mat-slide-toggle
      [checked]="showFacsimilePreview$ | async"
      (change)="toggleFacsimile($event.checked)"
      >Facsimile</mat-slide-toggle
    >

    <button
      (click)="openSettingsDialog()"
      mat-button
      aria-label="page settings"
    >
      <mat-icon>settings</mat-icon> Settings...
    </button>

    <button
      [matMenuTriggerFor]="downloadsMenu"
      mat-button
      aria-label="downloads"
    >
      <mat-icon>download</mat-icon> Downloads...
    </button>
    <mat-menu #downloadsMenu="matMenu">
      <button (click)="downloadUnitTable()" mat-menu-item>
        Unit Table (CSV)
      </button>
      <button (click)="downloadEditionTable()" mat-menu-item>
        Edition Table (CSV)
      </button>
    </mat-menu>
  </div>

  <button (click)="openSettingsDialog()" class="settings-btn" mat-icon-button>
    <mat-icon>settings</mat-icon>
  </button>

  <button
    (click)="toggleMobileSearchPanel()"
    class="search-btn"
    mat-icon-button
  >
    <mat-icon>{{ showMobileSearchPanel() ? 'search_off' : 'search' }}</mat-icon>
  </button>

  <div class="search-controls">
    <form>
      <mat-form-field subscriptSizing="dynamic" color="accent">
        <mat-icon matIconPrefix>search</mat-icon>
        <input
          [formControl]="searchControl"
          autocomplete="off"
          type="text"
          matInput
          placeholder="Search unit numbers, titles, or content"
        />
      </mat-form-field>
    </form>
    @if(numberOfResults() > 0) {
    <div class="result-nav">
      <div class="arrow" (click)="previousResult()"><p><| &nbsp;</p></div>
      <div class="number-of-results">
        <p>{{ currentResult() + 1 }} / {{ numberOfResults() }}</p>
      </div>
      <div class="arrow" (click)="nextResult()"><p>&nbsp; |></p></div>
    </div>
    }
    <mat-icon
      matTooltip="Entered text determines search type: (1) Digits trigger unit number search. (2) Latin letters trigger title search. (3) Arabic letters trigger content search. "
      >info</mat-icon
    >
  </div>
</mat-toolbar>
