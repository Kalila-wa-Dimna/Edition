<kd-layout>
  <span title>{{ summary.display }}</span>

  <main
    pageContent
    [ngClass]="
      (isMainFullWidth$ | async) ? 'full-width-main' : 'responive-width-main'
    "
  >
    @if(titles().length > 0) {
    <kd-collation-command-bar
      (goToRow)="onGoToRow($event)"
      [titles]="titles()"
      [collationName]="summary.siglum"
    ></kd-collation-command-bar>
    }

    <div class="outer-container">
      <div
        [ngClass]="{
          'collation-container-full': !(
            (showFacsimilePreview$ | async) || (showMap$ | async)
          ),
          'collation-container-with-panel':
            (showFacsimilePreview$ | async) || (showMap$ | async)
        }"
        cdkVirtualScrollingElement
      >
        <kd-collation-heading [columns]="columns"></kd-collation-heading>
        <cdk-virtual-scroll-viewport
          kdCollationVirtualScroll
          [units]="units"
          #collationBody
          class="collation-body"
          [ngStyle]="{
            'width.px':
              columns.length * ((cellWidth$ | async) ?? 75) +
              2 * columns.length * cellPadding,
            'font-size.px': fontSize$ | async
          }"
        >
          <kd-collation-row
            *cdkVirtualFor="let item of rowData; index as rowIndex"
            [unit]="units[rowIndex]"
            [sigla]="sigla"
            [rowData]="item"
            [searchResult]="highlightedRows()?.includes(rowIndex) || false"
            [currentResult]="activeHighlightedRow() === rowIndex"
            [ngStyle]="{
        'width.px': columns.length * ((cellWidth$ | async) ?? 75) + 2 * columns.length * cellPadding,
      }"
          >
          </kd-collation-row>
        </cdk-virtual-scroll-viewport>
      </div>
      @if(showFacsimilePreview$ | async) {
      <div class="panel">
        <kd-facsimile-panel-command-bar class="facsimile-panel-command-bar">
        </kd-facsimile-panel-command-bar>
        <kd-facsimile-panel
          (goToRow)="onGoToRow($event)"
          class="facsimile-panel"
        >
        </kd-facsimile-panel>
      </div>

      } @else if(showMap$ | async) {
      <div class="panel">
        <kd-map-panel
          [collationName]="summary.siglum"
          [currentIndex]="currentScrollIndex()"
          [cellsWithResults]="cellsWithResults()"
          (rowClicked)="onGoToRow($event)"
          (rowHovered)="showTitelPreview.set($event)"
          class="map-panel"
        >
          @if(showTitelPreview() !== null ) {
          <mat-card>
            <mat-card-content>
              {{ getTitelPreview() }}
            </mat-card-content>
          </mat-card>
          }
        </kd-map-panel>
      </div>

      }
    </div>
  </main>
</kd-layout>
