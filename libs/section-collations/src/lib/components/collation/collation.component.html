<kd-layout>
  <div title>
    <span>{{ summary.display }}</span>
    @if(version) {
    <span
      class="version-number"
      [matTooltip]="versionDetails"
      matTooltipPosition="below"
      >&nbsp;(updated: {{ version | date : 'dd.MM.yyyy, HH:mm' }})</span
    >
    }
  </div>

  <main
    pageContent
    [ngClass]="
      (isMainFullWidth$ | async) ? 'full-width-main' : 'responive-width-main'
    "
  >
    @if(titles().length > 0) {
    <kd-collation-command-bar
      (goToRow)="onGoToRow($event)"
      [titles]="titles()"
      [collationName]="summary.siglum"
    ></kd-collation-command-bar>
    }

    <div class="outer-container">
      @if(rowData().length > 0) {
      <kd-collation-container
        [rowData]="rowData()"
        [sigla]="sigla"
        [columns]="columns"
        [units]="units"
        [ngClass]="{
          'collation-container-full': !(
            (showFacsimilePreview$ | async) || (showMap$ | async)
          ),
          'collation-container-with-panel':
            (showFacsimilePreview$ | async) || (showMap$ | async)
        }"
        cdkVirtualScrollingElement
      >
      </kd-collation-container>
      }
      <!-- panels -->
      @if(showFacsimilePreview$ | async) {
      <div class="panel">
        <kd-facsimile-panel-command-bar class="facsimile-panel-command-bar">
        </kd-facsimile-panel-command-bar>
        <kd-facsimile-panel
          (goToRow)="onGoToRow($event)"
          class="facsimile-panel"
        >
        </kd-facsimile-panel>
      </div>

      } @else if(showMap$ | async) {
      <div class="panel">
        <kd-map-panel
          [collationName]="summary.siglum"
          [currentIndex]="currentScrollIndex()"
          [cellsWithResults]="cellsWithResults()"
          (rowClicked)="onGoToRow($event)"
          (rowHovered)="showTitlePreview.set($event)"
          class="map-panel"
        >
          @if(showTitlePreview() !== null ) {
          <mat-card>
            <mat-card-content>
              {{ getTitelPreview() }}
            </mat-card-content>
          </mat-card>
          }
        </kd-map-panel>
      </div>

      }
    </div>
  </main>
</kd-layout>
