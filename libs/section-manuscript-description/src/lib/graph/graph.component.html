<kd-layout>
  <span title style="font-size: large;">Manuscript Descriptions</span>
  <main pageContent style="margin-top: 10px;">
    <div class="container">
      <!-- Chart container -->
      <div class="chart-container" #chartContainer></div>
      <div class="filters-panel">
        <!-- Filters: Checkboxes aligned to the right -->
        <div class="checkbox-panel">
            <div class="checkbox-group" *ngFor="let category of ['continuum', 'copy_group', 'sequence', 'century']">
              <p class="checkbox-caption"> Select <br /> 
                {{
                  category === 'continuum' ? 'Textual' :
                  category === 'copy_group' ? 'Copy' :
                  category === 'sequence' ? 'Sequence' :
                  category === 'century' ? 'Century' : ''
                }} Groups
              </p>
              <mat-checkbox *ngFor="let group of groupCategories[category]"
                            (change)="toggleGroup(category, group)"
                            [checked]="selectionStates[category][group]"
                            [disabled]="!possibleOptions[category].has(group)"
                            [class.highlight]="possibleOptions[category].has(group)">
                {{ group === '' ? 'Unspecified' : capitalizeFirstLetter(group) }}
              </mat-checkbox>          
            </div> 
          </div>
        <button class="reset-button" (click)="resetGraph()">Reset Graph</button>
      </div>
    </div>
  </main>
</kd-layout>
