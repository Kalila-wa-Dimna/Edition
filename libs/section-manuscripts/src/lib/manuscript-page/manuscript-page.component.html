<kd-layout>
  <div title>
    <span>{{ manuscriptID }}/{{ chapter }}/{{ pageNumber }}</span>
    <span class="version-number"
      >&nbsp;(updated: {{ version | date : 'dd.MM.yyyy, HH:mm' }})</span
    >
  </div>

  <main class="full-width-main" pageContent>
    <router-outlet name="command"></router-outlet>
    <div class="page-and-text">
      <router-outlet name="text"></router-outlet>
      <router-outlet name="facsimile"></router-outlet>
    </div>
  </main>
</kd-layout>
