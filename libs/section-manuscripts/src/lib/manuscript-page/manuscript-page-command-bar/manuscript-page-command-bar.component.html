<mat-toolbar class="tool">
    <ng-container *ngFor="let item of items; let firstItem = first">
      <ng-container *ngIf="!hasSubItems(item); else subMenu">
        <!-- Display the first item as a label without button styling -->
        <!--<ng-container *ngIf="firstItem">
          <span [ngClass]="item.styleClass" style="padding:20px ">{{ item.label }}</span>
        </ng-container>-->
        <!-- Display other items as buttons -->
        <ng-container *ngIf="!firstItem">
          <button mat-stroked-button class="mat-button"  (click)="item.command?.()">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span [ngClass]="item.styleClass">{{ item.label }}</span>
          </button>
        </ng-container>
      </ng-container>
      <ng-template #subMenu>
        <button mat-stroked-button  class="mat-button"  [matMenuTriggerFor]="itemMenu"
                *ngIf="hasSubItems(item)" >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span [ngClass]="item.styleClass">{{ item.label }}</span>
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
        <mat-menu #itemMenu="matMenu">
          <button mat-menu-item *ngFor="let subItem of item.items" (click)="subItem.command?.()">
            <mat-icon>{{ subItem.icon }}</mat-icon>
            <span [ngClass]="subItem.styleClass">{{ subItem.label }}</span>
          </button>
        </mat-menu>
      </ng-template>
    </ng-container>
</mat-toolbar>
