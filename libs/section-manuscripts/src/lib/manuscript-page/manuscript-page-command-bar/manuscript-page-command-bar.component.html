<div class="command-bar">
  <div class="bar-section language-section">
    <span class="section-label">Language</span>
    <div class="segmented" role="group" aria-label="Language">
      <button
        type="button"
        class="segment"
        [class.active]="viewMode === 'source'"
        (click)="changeToSourceLanguage()"
      >
        {{ sourceLanguageLabel }}
      </button>
      <button
        type="button"
        class="segment"
        [class.active]="viewMode === 'english'"
        [disabled]="!isEnglishClickable()"
        [matTooltip]="
          isEnglishClickable()
            ? 'English translation'
            : 'English available for Mc only'
        "
        (click)="changeToEnglish()"
      >
        English
      </button>
      <button
        type="button"
        class="segment"
        [class.active]="viewMode === 'both'"
        [disabled]="!isEnglishClickable()"
        [matTooltip]="
          isEnglishClickable()
            ? 'Arabic and English side by side'
            : 'Side-by-side available for Mc only'
        "
        (click)="changeToBoth()"
      >
        Both
      </button>
    </div>
  </div>

  <div class="bar-section language-section">
    <span class="section-label">Text</span>
    <div class="segmented" role="group" aria-label="Text view">
      <button
        type="button"
        class="segment"
        [class.active]="contentMode === 'transcription'"
        matTooltip="Transcription beside facsimile"
        (click)="setContentMode('transcription')"
      >
        Transcription
      </button>
      <button
        type="button"
        class="segment"
        [class.active]="contentMode === 'xml'"
        matTooltip="TEI XML beside facsimile"
        (click)="setContentMode('xml')"
      >
        XML
      </button>
      <button
        type="button"
        class="segment"
        [class.active]="contentMode === 'both'"
        matTooltip="Transcription and XML side by side"
        (click)="setContentMode('both')"
      >
        Both
      </button>
    </div>
  </div>

  <div class="bar-section nav-section">
    <div class="page-nav">
      <button
        type="button"
        class="icon-btn"
        aria-label="Previous page"
        matTooltip="Previous page"
        (click)="navigateToThePreviousPage()"
      >
        <mat-icon>chevron_left</mat-icon>
      </button>
      <span class="page-badge">p. {{ pageNumber }}</span>
      <button
        type="button"
        class="icon-btn"
        aria-label="Next page"
        matTooltip="Next page"
        (click)="navigateToTheNextPage()"
      >
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>

    <button
      type="button"
      class="action-btn"
      [class.active]="facsimileVisible"
      aria-label="Toggle facsimile"
      [matTooltip]="facsimileVisible ? 'Hide facsimile' : 'Show facsimile'"
      (click)="toggleFacsimile()"
    >
      <mat-icon>image</mat-icon>
      <span>Facsimile</span>
    </button>

    <button
      type="button"
      class="action-btn"
      aria-label="Open page gallery"
      matTooltip="Open page gallery"
      (click)="openGallery()"
    >
      <mat-icon>photo_library</mat-icon>
      <span>Gallery</span>
    </button>

    <button
      type="button"
      class="action-btn"
      aria-label="Downloads"
      matTooltip="Download pages"
      [matMenuTriggerFor]="downloadsMenu"
      [disabled]="downloadBusy"
    >
      <mat-icon>download</mat-icon>
      <span>{{ downloadBusy ? 'Preparing…' : 'Downloads' }}</span>
    </button>
    <mat-menu #downloadsMenu="matMenu">
      <button mat-menu-item (click)="downloadAllText()" [disabled]="downloadBusy">
        All pages as text (.zip)
      </button>
      <button mat-menu-item (click)="downloadAllImages()" [disabled]="downloadBusy">
        All pages as images (.zip)
      </button>
      <button mat-menu-item (click)="downloadAllXml()" [disabled]="downloadBusy">
        All pages as XML (.zip)
      </button>
      <button mat-menu-item (click)="downloadAllJson()" [disabled]="downloadBusy">
        All pages as JSON (.zip)
      </button>
      <button mat-menu-item (click)="downloadCurrentXml()" [disabled]="downloadBusy">
        Current page as XML
      </button>
      <button mat-menu-item (click)="downloadCurrentJson()" [disabled]="downloadBusy">
        Current page as JSON
      </button>
    </mat-menu>
  </div>

  <div class="bar-section chapters-section">
    <span class="section-label">Chapters</span>
    <div class="chapters-nav" role="navigation" aria-label="Chapters">
      @for (chapterItem of chapters; track chapterItem.chapter) {
        <button
          type="button"
          class="chapter-chip"
          [class.active]="isCurrentChapter(chapterItem.chapter)"
          [matTooltip]="chapterTooltip(chapterItem)"
          (click)="navigateToChapter(chapterItem)"
        >
          {{ chapterItem.chapter }}
        </button>
      }
    </div>
  </div>
</div>
