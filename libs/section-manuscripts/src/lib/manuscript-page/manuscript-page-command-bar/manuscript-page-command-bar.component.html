<mat-toolbar class="tool original-toolbar">
  <ng-container *ngFor="let item of items">
    <ng-container *ngIf="!hasSubItems(item); else subMenu">
      <ng-container>
        <!-- Display the page number as text when the label is ' ' -->
        <ng-container *ngIf="item.label === ' '">
          <span [ngClass]="item.styleClass" class="mat-lable">{{ pageNumber }}</span>
        </ng-container>
        <!-- Display other items as buttons -->
        <ng-container *ngIf="item.label !== ' '">
          <button mat-stroked-button class="mat-button" (click)="item.command?.()" ngSkipHydration>
            <mat-icon>{{ item.icon }}</mat-icon>
            <span [ngClass]="item.styleClass">{{ item.label }}</span>
          </button>
        </ng-container>
      </ng-container>
    </ng-container>
    <ng-template #subMenu>
      <button mat-stroked-button class="mat-button" [matMenuTriggerFor]="itemMenu" *ngIf="hasSubItems(item)" ngSkipHydration>
        <mat-icon>{{ item.icon }}</mat-icon>
        <span [ngClass]="item.styleClass">{{ item.label }}</span>
        <mat-icon>keyboard_arrow_down</mat-icon>
      </button>
      <mat-menu #itemMenu="matMenu">
        <button mat-menu-item class="sub-item-container" *ngFor="let subItem of item.items"
                [disabled]="subItem.label === 'English' && shouldDisableButton(subItem)"
                [style.color]="subItem.label === 'English' && shouldDisableButton(subItem) ? 'gray' : 'inherit'"
                (click)="subItem.command?.()" ngSkipHydration>
          <mat-icon class="sub-item-icon">{{ subItem.icon }}</mat-icon>
          <span [ngClass]="subItem.styleClass" class="sub-item-label">{{ subItem.label }}</span>
        </button>
      </mat-menu>
    </ng-template>
  </ng-container>
</mat-toolbar>
