<kd-layout>
  <span title>Illustrations</span>

  <main pageContent>
    <div class="table-container">
      <table mat-table [dataSource]="data.illustrationsList" class="mat-elevation-z8">
        <ng-container matColumnDef="manuscripts">
          <th mat-header-cell *matHeaderCellDef style="font-size: large; font-weight: bold;margin-top: 10px"> Manuscripts </th>
          <td mat-cell *matCellDef="let row">
            <div style="font-size: large; font-weight: bold;color:#4c7d8a;margin-top: 10px"> Chapter {{ row.chapter }} ({{row.chapter_name}}) </div>
            <ng-container *ngFor="let manuscript of row.manuscripts">
              <div class="manuscript-container">
                <p class="p-m"> {{ manuscript.siglum }}</p>
                <div class="illustrations-container">
                  <div *ngFor="let illustration of manuscript.illustrations">
                    <div class="image-grid">
                    <div class="image-container illustration-caption"  (click)="openIllustrationModal(pagesEndPoint +illustration)" >
                      <img class="image" [src]="pagesEndPoint + illustration" alt="Illustration">
                      <div class="caption">{{ getIllustrationName(illustration) }}</div>
                    </div>
                    </div>
                  </div>
                </div>
              </div>
            </ng-container>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="[ 'manuscripts']"  ></tr>
        <tr mat-row *matRowDef="let row; columns: ['manuscripts'];" ></tr>
      </table>
    </div>
  </main>
</kd-layout>
