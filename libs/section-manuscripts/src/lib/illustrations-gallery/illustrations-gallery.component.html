<kd-layout>
  <span title>Illustrations gallery</span>

  <main pageContent>
    <div class="table-container">
      <table mat-table [dataSource]="data.illustrationsList" class="mat-elevation-z8">

        <ng-container matColumnDef="chapter">
          <th mat-header-cell *matHeaderCellDef> Chapter </th>
          <td mat-cell *matCellDef="let row"> {{ row.chapter }} </td>
        </ng-container>

        <ng-container matColumnDef="manuscripts">
          <th mat-header-cell *matHeaderCellDef> Manuscripts </th>
          <td mat-cell *matCellDef="let row">
            <ng-container *ngFor="let manuscript of row.manuscripts">
              <div class="manuscript-container">
                <p class="p-m"> {{ manuscript.siglum }}</p>
                <div class="illustrations-container">
                  <div *ngFor="let illustration of manuscript.illustrations">
                    <div class="illustration-caption">
                      <img [src]="pagesEndPoint + illustration" alt="Illustration" style="max-width: 200px; max-height: 200px; margin: 5px;">
                      <div class="caption">{{ getIllustrationName(illustration) }}</div>
                    </div>
                  </div>
                </div>
              </div>
            </ng-container>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['chapter', 'manuscripts']" ></tr>
        <tr mat-row *matRowDef="let row; columns: ['chapter', 'manuscripts'];"></tr>
      </table>
    </div>
  </main>
</kd-layout>
