<kd-layout>
  <span title>Manuscripts</span>

  <main pageContent>
    <ng-template ngFor let-item [ngForOf]="data">
      <mat-card class="card">
        <mat-card-header>
          <!-- <div mat-card-avatar></div> -->
          <mat-card-title>{{ item.display }}</mat-card-title>
          <mat-card-subtitle>Manuscript</mat-card-subtitle>
        </mat-card-header>
        <img
          mat-card-image
          width="100%"
          height="100%"
          [src]="imageEndpoint + item.image"
          alt="Photo of Manuscript"
        />
        <mat-card-content></mat-card-content>
        <mat-card-actions>
          <a
            [routerLink]="[
              item.siglum + '/' + item.first_chapter + '/' + item.first_page
            ]"
            mat-raised-button
            style="font-size: 1.3rem"
          >
            <mat-icon
              aria-hidden="false"
              aria-label="Example home icon"
              fontIcon="visibility"
            ></mat-icon>
            View</a
          >
        </mat-card-actions>
      </mat-card>
    </ng-template>
  </main>
</kd-layout>
