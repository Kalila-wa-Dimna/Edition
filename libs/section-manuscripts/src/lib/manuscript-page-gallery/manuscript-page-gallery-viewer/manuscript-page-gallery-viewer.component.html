
  <div class="container">
    <lightgallery [settings]="settings"  [onInit]="onInit">
      <a *ngFor="let item of data" className="gallery-item" [attr.href]="'assets/data/manuscripts/'+item.src"  [attr.data-sub-html]="item.caption">
        <span class="image-container">
          <img class="img-responsive" [src]="'assets/data/manuscripts/' + item.src" />
           <span class="caption">{{ item.caption }}</span>
        </span>
      </a>
    </lightgallery>
  </div>
