<div class="gallery-bar">
  <div class="bar-row actions-row">
    <button
      type="button"
      class="action-btn"
      (click)="navigateToFacsimileText()"
      matTooltip="Open transcription / facsimile"
    >
      <mat-icon>menu_book</mat-icon>
      <span>Open page</span>
    </button>
  </div>

  <div class="bar-row manuscripts-row">
    <span class="section-label">Manuscripts</span>
    <div class="ms-nav" role="navigation" aria-label="Manuscript galleries">
      @for (ms of manuscriptsInfo; track ms.siglum) {
        <button
          type="button"
          class="ms-chip"
          [class.active]="isSelectedManuscript(ms.siglum)"
          [attr.aria-current]="isSelectedManuscript(ms.siglum) ? 'true' : null"
          [matTooltip]="ms.display || ms.siglum"
          (click)="navigateToTheSelectedManuscript(ms.siglum)"
        >
          {{ ms.siglum }}
        </button>
      }
    </div>
  </div>
</div>
